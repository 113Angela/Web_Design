<!DOCTYPE html>
<html>
<head>
  <style>
    p
    {
      width:1000px;
    }
    p.one
    {
      font-size:60px;
      font-weight:bold;
      text-decoration: overline;
      text-shadow:4px 4px pink;
    }
    p.two
    {
      font-size:50px;
      font-weight:bold;
      font-style:italic;
      border:1px solid black;
      outline:thick ridge yellow;
    }
    p.three
    {
      font-size:40px;
      font-weight:bold;
      text-align:right;
      text-decoration:underline;
    }
  </style>
</head>

<body>
  <p class="one">This is heading 1</p>
  <p class="two">This is heading 2</p>
  <p class="three">This is heading 3</p>
</body>
</html>
