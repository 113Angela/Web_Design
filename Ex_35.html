<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Object Properties</title>
</head>
<body>
    <div id="before"></div>
    <br>
    <div id="after"></div>

    <script>
        // Create object
        var Person = {
            firstName: "Tony",
            lastName: "Lee",
            age: 50,
            eyeColor: "Blue"
        };

        // Show original properties
        let beforeText = "";

        for (let key in Person) {
            beforeText += key + " : " + Person[key] + "<br>";
        }

        document.getElementById("before").innerHTML = beforeText;

        // Delete age property
        delete Person.age;

        // Show object after deleting
        let afterText = "";

        for (let key in Person) {
            afterText += key + " : " + Person[key] + "<br>";
        }

        document.getElementById("after").innerHTML = afterText;
    </script>

</body>
</html>
