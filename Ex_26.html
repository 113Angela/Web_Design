<!DOCTYPE html>
<html>
<head>
  <style>
    .container 
    {
      display: flex;
      align-items: flex-start;
    }
    .img-left
    {
      width:33%;
      border-radius: 18px;
      object-fit:cover;
    }
    .img-circle
    {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit:cover;
    }
    .img-right
    {
      width:33%;
      height: 300px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://picsum.photos/id/1015/600/400" class="img-left">
    <img src="https://picsum.photos/id/1016/600/400" class="img-circle">
    <img src="https://picsum.photos/id/1015/600/400" class="img-right">
  </div>
</body>
</html>
