<!DOCTYPE html>
<html>
<head>
  <style>
    table, th, td
    {
      border: 1px solid black;
      padding:5px;
    }
    table
    {
      border-collapse:collapse;
    }
    th
    {
      text-algin:center;
      background-color:gray;
      color:white;
    }
    td
    {
      text-algin:left;
    }
    tr:nth-child(even)
    {
      background-color:yellow;
    }
  </style>
</head>

<body>
  <table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
  </tr>
  <tr>
    <td>1</td>
    <td>1</td>
  </tr>
    <tr>
    <td>2</td>
    <td>2</td>
  </tr>
    <tr>
    <td>3</td>
    <td>3</td>
  </tr>
</body>
</html>
