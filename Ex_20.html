<!DOCTYPE html>
<html>
<head>
  <style>
    table, th, td
    {
      border: 1px solid black;
      padding:8px;
    }
    table
    {
      border-collapse:collapse;
    }
    th
    {
      text-align:center;
      background-color:gray;
      color:white;
    }
    td
    {
      text-align:left;
    }
    tr:nth-child(even)
    {
      background-color:yellow;
    }

    .box 
    {
      position: fixed;
      top: 20px;
      right: 20px;
      border: 4px solid green;
      width: 100px;
      height: 100px;
    }
  </style>
</head>

<body>
  <table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
  </tr>
  <tr>
    <td>1</td>
    <td>1</td>
  </tr>
    <tr>
    <td>2</td>
    <td>2</td>
  </tr>
    <tr>
    <td>3</td>
    <td>3</td>
  </tr>

  <div class="box">
    This div element has position: fixed;
  </div>
</body>
</html>
