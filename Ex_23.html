<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Preview</title>

<style>
body {
  margin: 0;
  font-family: Roboto, sans-serif;
  font-size: 13px;
  color: #2f2f2f;
}

/* 🔳 整個上方灰色區塊（重點） */
.header {
  background-color: #d9d9d9;
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 左上「預覽」 */
.title {
  color: #707070;
}

/* 按鈕（只有一顆） */
.btn {
  height: 22px;
  padding: 0 18px;
  background-color: #ffffff;
  border: 1px solid #2f2f2f;
  border-radius: 8px;
  font-size: 13px;
  color: #2f2f2f;
  cursor: pointer;
}

/* 皮膚色區塊 */
.preview-bg {
  width: 520px;
  margin: 20px auto;
  background-color: #f3d9b8;
  padding: 15px;
  box-sizing: border-box;
}

/* 圖片 */
.preview-img {
  width: 100%;
  height: 240px;
  object-fit: cover;
}

/* 下方詳細資料（預設隱藏） */
.detail {
  display: none;
  width: 520px;
  margin: 0 auto 50px;
}

/* 每一行綠底 */
.row {
  background-color: #8ff38f;
  padding: 8px 10px;
  border-bottom: 1px solid #ffffff;
}
</style>
</head>

<body>

<!-- 🔥 灰色整條 -->
<div class="header">
  <div class="title">預覽</div>
  <button class="btn" onclick="showDetail()">查看資料</button>
</div>

<!-- 圖片區 -->
<div class="preview-bg">
  <img class="preview-img" src="https://picsum.photos/520/240">
</div>

<!-- 詳細資料（出現在整頁下方） -->
<div class="detail" id="detail">
  <div class="row">發佈日期：2017/10/12</div>
  <div class="row">格式：JPG</div>
  <div class="row">檔案大小：466.97KB</div>
  <div class="row">路徑：sample/path</div>
</div>

<script>
function showDetail() {
  document.getElementById("detail").style.display = "block";
}
</script>

</body>
</html>
