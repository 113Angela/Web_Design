<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Detail</title>
  <style>
    body {
      font-family: Roboto, sans-serif;
      font-size: 13px;
      color: #2f2f2f;
    }

    .wrapper {
      width: 520px;
      margin: 30px auto;
    }

    .top-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      font-size: 13px;
      color: #707070;
    }

    .btn-frame {
      border: 1px solid #2f2f2f;
      padding: 6px;
      display: inline-block;
      background-color: #ffffff;
    }

    .btn {
      height: 22px;
      padding: 0 18px;
      background-color: #ffffff;
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      font-size: 13px;
      font-family: Roboto, sans-serif;
      color: #2f2f2f;
      cursor: pointer;
    }

    .preview-bg {
      width: 496px;
      margin: 0 auto;
      background-color: #f3d9b8;
      padding: 14px;
      box-sizing: border-box;
    }

    .preview-img {
      width: 450px;
      height: 240px;
      display: block;
      margin: 0 auto;
      object-fit: cover;
      background-color: #ddd;
    }

    .detail-box {
      width: 496px;
      height: 101px;
      margin: 20px auto 0;
      border: 1px solid #cccccc;
      overflow-y: scroll;
      box-sizing: border-box;
      display: none;
      background-color: #ffffff;
    }

    .detail-row {
      background-color: #8ff38f;
      color: #2f2f2f;
      padding: 6px 10px;
      line-height: 1.4;
      border-bottom: 1px solid #ffffff;
      white-space: nowrap;
    }

    .detail-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="top-area">
      <div class="title">預覽</div>

      <div class="btn-frame">
        <button class="btn" onclick="showDetail()">收起資訊</button>
      </div>
    </div>

    <div class="preview-bg">
      <img class="preview-img" src="https://picsum.photos/450/240" alt="preview image">
    </div>

    <div class="detail-box" id="detailBox">
      <div class="detail-row">發佈日期：2017/10/12</div>
      <div class="detail-row">格式：JPG</div>
      <div class="detail-row">檔案大小：466.97KB</div>
      <div class="detail-row">路徑：\\designcenter.qnap.com.tw\DesignCenterPM\RD\Image2PDF\v2\sample</div>
    </div>
  </div>

  <script>
    function showDetail() {
      var box = document.getElementById("detailBox");
      if (box.style.display === "block") {
        box.style.display = "none";
      } else {
        box.style.display = "block";
      }
    }
  </script>

</body>
</html>
