<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Preview Page</title>
  <style>
    body {
      font-family: Roboto, sans-serif;
      font-size: 13px;
      color: #2f2f2f;
      background: #ffffff;
    }

    .wrapper {
      width: 520px;
      margin: 30px auto;
    }

    /* 上方預覽列 */
    .bar {
      width: 496px;
      height: 35px;
      margin: 0 auto;
      background: #f6f6f6;
      border: 1px solid #eaeaea;
      box-sizing: border-box;
      padding: 0 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 13px;
      color: #707070;
    }

    .btn {
      height: 22px;
      padding: 0 18px;
      background: #ffffff;
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      font-family: Roboto, sans-serif;
      font-size: 13px;
      color: #2f2f2f;
      cursor: pointer;
    }

    /* 上面的大圖 */
    .preview-bg {
      width: 496px;
      margin: 0 auto;
      background: #f3d3af;
      padding: 20px 23px;
      box-sizing: border-box;
    }

    .preview-img {
      width: 450px;
      height: 240px;
      display: block;
      object-fit: cover;
    }

    /* 下方詳細面板 */
    .detail-panel {
      width: 496px;
      height: 260px;
      margin: 20px auto 0;
      border: 1px solid #d9d9d9;
      box-sizing: border-box;
      display: none;
      overflow-y: scroll;
      background: #ffffff;
    }

    .detail-bar {
      height: 35px;
      background: #f6f6f6;
      border-bottom: 1px solid #eaeaea;
      box-sizing: border-box;
      padding: 0 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }

    /* 下方預覽圖也維持同樣比例，不變形 */
    .detail-preview-bg {
      background: #f3d3af;
      padding: 10px 20px 6px 20px;
      box-sizing: border-box;
    }

    .detail-img {
      width: 100%;
      aspect-ratio: 450 / 240;
      display: block;
      object-fit: cover;
    }

    /* 綠色資料區：照圖上的間距邏輯 */
    .detail-rows {
      padding-left: 20px;
      padding-right: 26px; /* 右側留給卷軸 */
      padding-top: 6px;
      padding-bottom: 10px;
      box-sizing: border-box;
    }

    .row {
      height: 10px;
      line-height: 10px;
      background: #8ff38f;
      color: #2f2f2f;
      font-size: 10px;
      margin-bottom: 6px;
      padding: 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row:last-child {
      margin-bottom: 0;
      height: auto;
      line-height: 1.2;
      min-height: 10px;
      padding-top: 2px;
      padding-bottom: 2px;
      white-space: normal;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="bar">
      <div class="title">預覽</div>
      <button class="btn" onclick="showDetail()">查看資訊</button>
    </div>

    <div class="preview-bg">
      <img class="preview-img" src="https://picsum.photos/450/240" alt="preview">
    </div>

    <div class="detail-panel" id="detailPanel">
      <div class="detail-bar">
        <div class="title">預覽</div>
        <button class="btn">收起資訊</button>
      </div>

      <div class="detail-preview-bg">
        <img class="detail-img" src="https://picsum.photos/450/240" alt="preview">
      </div>

      <div class="detail-rows">
        <div class="row">發佈日期：2017/10/12</div>
        <div class="row">類別：JPG</div>
        <div class="row">大小：466.97KB</div>
        <div class="row">路徑：\\designcenter.qnap.com.tw\DesignCenterPM\RD\Image2PDF\v2\sample</div>
      </div>
    </div>
  </div>

  <script>
    function showDetail() {
      document.getElementById("detailPanel").style.display = "block";
    }
  </script>

</body>
</html>
