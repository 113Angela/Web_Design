<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Detail</title>
  <style>
    body {
      font-family: Roboto, sans-serif;
      font-size: 13px;
      color: #2f2f2f;
      margin: 0;
      padding: 30px;
    }

    .wrapper {
      width: 520px;
      margin: 0 auto;
    }

    .top-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      font-size: 13px;
      color: #707070;
    }

    /* 灰色區塊 */
    .toolbar {
      background-color: #d9d9d9;
      padding: 8px;
    }

    /* 只有一個按鈕 */
    .btn {
      height: 22px;
      padding: 0 18px;
      background-color: #ffffff;
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      font-family: Roboto, sans-serif;
      font-size: 13px;
      color: #2f2f2f;
      cursor: pointer;
    }

    /* 皮膚色背景 */
    .preview-bg {
      width: 496px;
      margin: 12px auto 0;
      background-color: #f3d9b8;
      padding: 14px;
      box-sizing: border-box;
    }

    .preview-img {
      width: 450px;
      height: 240px;
      display: block;
      margin: 0 auto;
      object-fit: cover;
      background-color: #ddd;
    }

    /* 預設不顯示 */
    .detail-section {
      display: none;
      width: 496px;
      margin: 20px auto 0;
    }

    .detail-row {
      background-color: #8ff38f;
      color: #2f2f2f;
      padding: 8px 10px;
      border-bottom: 1px solid #ffffff;
      box-sizing: border-box;
    }

    .detail-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-area">
      <div class="title">預覽</div>
      <div class="toolbar">
        <button class="btn" onclick="showDetail()">查看資料</button>
      </div>
    </div>

    <div class="preview-bg">
      <img class="preview-img" src="https://picsum.photos/450/240" alt="preview image">
    </div>

    <div class="detail-section" id="detailSection">
      <div class="detail-row">發佈日期：2017/10/12</div>
      <div class="detail-row">格式：JPG</div>
      <div class="detail-row">檔案大小：466.97KB</div>
      <div class="detail-row">路徑：\\designcenter.qnap.com.tw\DesignCenterPM\RD\Image2PDF\v2\sample</div>
    </div>
  </div>

  <script>
    function showDetail() {
      document.getElementById("detailSection").style.display = "block";
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }
  </script>
</body>
</html>
