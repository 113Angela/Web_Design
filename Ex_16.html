<!DOCTYPE html>
<html>
<head>
  <style>
    p
    {
      width:250px;
    }
    p.one
    {background-color:#ADD8E6; 
     border-color:red;
     border-style:double;
     border-width:5px;
     }
    p.two
    {background-color:yellow;
     border-color:blue;
     border-style:solid;
     border-radius:5px;
    }
    p.three
    {background-color:green; 
     border-color:gray;
     border-style:dotted;
     border-width:5px;
    }
  </style>
</head>

<body>
  <p class="one">Hello World</p>
  <p class="two">Hello World</p>
  <p class="three">Hello World</p>
</body>
</html>
